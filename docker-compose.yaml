version: "3.8"

services:
  api-gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    ports:
      - "${PORT}:8080"
    environment:
      - PORT=${PORT}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL}
      - IMAGE_SERVICE_URL=${IMAGE_SERVICE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    depends_on:
      - identity-service
      - image-service
      - word-service
    networks:
      - app-network

  identity-service:
    build:
      context: .
      dockerfile: identity_service/Dockerfile
    ports:
      - "${PORT}:8081"
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_SECRET_REFRESH=${JWT_SECRET_REFRESH}
      - JWT_OTP_SECRET=${JWT_OTP_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - API_GATEWAY=${API_GATEWAY}
      - WORD_FILTER_SERVICE_URL=${WORD_FILTER_SERVICE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    networks:
      - app-network

  word-service:
    build:
      context: .
      dockerfile: word_filter_service/Dockerfile
    ports:
      - "${PORT}:8082"
    environment:
      - PORT=${PORT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    networks:
      - app-network

  image-service:
    build:
      context: .
      dockerfile: image_check/Dockerfile
    ports:
      - "${PORT}:8083"
    environment:
      - PORT=${PORT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    networks:
      - app-network

networks:
  app-network:
